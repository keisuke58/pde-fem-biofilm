name: CI

# Runs the verification assets on every push/PR: the unit suite, the
# Fortran UMAT <-> USERMAT cross-check + adversarial hunt, and a
# non-blocking repo audit.

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/

      # JAX is deliberately not in requirements.txt (see the note there), so
      # the JAX-dependent tests importorskip out of the step above. Installing
      # it here means they actually run instead of silently always skipping.
      - name: Install JAX (CPU)
        run: pip install "jax[cpu]"

      # Re-run the WHOLE suite now that jax is present, rather than naming the
      # jax-dependent files. Naming them is how a new one gets silently
      # dropped: it importorskips out of the step above and is absent from
      # this one, so it never executes anywhere and CI is still green.
      #
      # The --strict-skip guard is the real protection. With the full
      # toolchain installed this suite skips nothing, so any skip means a
      # test quietly did not run -- a missing compiler, an absent import, a
      # stale marker. Passing by not running is the failure mode that hides
      # best, so it is made loud here.
      - name: Full suite with JAX (no test may silently skip)
        run: |
          pytest tests/ -q --no-header -rs | tee /tmp/full.txt
          if grep -qE '[0-9]+ skipped' /tmp/full.txt; then
            echo "::error::tests were skipped with the full toolchain installed --"
            echo "::error::they passed by not running. Reasons above (-rs)."
            exit 1
          fi

      - name: UMAT <-> USERMAT cross-check + adversarial hunt (Fortran)
        run: pytest ansys_usermat/crosscheck/crosscheck.py ansys_usermat/crosscheck/adversarial.py

      - name: Repo audit (non-blocking)
        continue-on-error: true
        run: python JAXFEM/audit_all.py --quick
